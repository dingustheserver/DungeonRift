# ─────────────────────────────────────────
#  DungeonRift  –  config.yml
# ─────────────────────────────────────────

templates-directory: templates
active-template: dungeon_week1

# Hub world name (must already exist in Multiverse)
hub-world: world_hub

# Where players spawn when first joining the hub world
hub-spawn:
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Where players return to after extracting from / dying in a rift
# Use /dungeon sethubreturn to set this to your current position
hub-return:
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ── Queue portal ───────────────────────────────────────────────────────────────
# Players stepping on this block location in the hub are queued automatically.
# Use /dungeon setqueueportal to set it to your current position.
# Set enabled: false to disable and use /rift queue only.
queue-portal:
  enabled: false
  world: world_hub
  x: 0.0
  y: 64.0
  z: 0.0
  # Radius in blocks around the portal centre that triggers the queue
  radius: 1.5

# ── Instance settings ──────────────────────────────────────────────────────────
instance:
  time-limit-minutes: 30
  warnings-at-minutes: [ 10, 5, 2, 1 ]
  extraction-hold-seconds: 10
  extraction-zone-radius: 3

  extraction-portal:
    x: 0
    y: 64
    z: 0

  instance-spawn:
    x: 0.5
    y: 65.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

  # ── Collapse settings ──────────────────────────────────────────────────────
  collapse:
    # Minutes remaining when the world starts its collapse sequence
    # e.g. 1 = collapse effects begin at 1 minute left
    start-at-minutes-remaining: 2

    # Sound effects played to all players every few seconds during collapse
    sounds-enabled: true

    # Weather effects (thunder storm)
    weather-enabled: true

    # Lightning strikes during collapse
    lightning-enabled: true

# ── Emergency extraction safety net ────────────────────────────────────────────
# If a player is in the extraction zone with <= this many seconds left,
# the timer pauses to give them a chance to finish extracting.
# If they leave the zone they get a 5-second warning before the timer resumes.
extraction-safety:
  enabled: true
  pause-at-seconds-remaining: 10

# ── Party settings ─────────────────────────────────────────────────────────────
party:
  max-size: 4
  invite-expiry-seconds: 60

# ── Loot settings ──────────────────────────────────────────────────────────────
loot:
  # true  → players enter with empty inventory (loadout they built in hub is cleared)
  # false → players carry their hub loadout into the rift
  clear-on-enter: false

  # Keep inventory in the hub world (so players can build loadouts safely)
  hub-keep-inventory: true

# ── Messages ───────────────────────────────────────────────────────────────────
messages:
  prefix: "&8[&6DungeonRift&8] &r"
